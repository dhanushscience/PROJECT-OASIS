<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OASIS</title>
  <!-- Before first paint: the saved theme, else Windows' (no flash of the wrong one). -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('oasis-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script type="module" crossorigin src="./assets/app-BhHxS_GD.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/MrScience-DprA17Ll.js">

</head>

</body>
</html>
